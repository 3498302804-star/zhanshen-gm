<script>
/* 尽早在首帧之前定下主题，避免闪一下白/黑 */
(function () {
  try {
    var raw = localStorage.getItem('zs_gm_slots_v1');
    var t = 'auto';
    if (raw) {
      var st = JSON.parse(raw);
      var rec = null;
      if (st && st.list) for (var i = 0; i < st.list.length; i++) if (st.list[i].id === st.active) rec = st.list[i];
      if (!rec && st && st.list && st.list.length) rec = st.list[0];
      if (rec && rec.data && rec.data.cfg && rec.data.cfg.theme) t = rec.data.cfg.theme;
    }
    var dark = t === 'dark' ? true : t === 'light' ? false
      : !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
</head>

<script>
/* 离线缓存（http/https 下生效；file:// 直接跳过） */
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}
</script>
